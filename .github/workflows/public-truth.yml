name: Public Truth Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile Python surfaces
        run: python -m compileall -q src tests mastermind_sidecar.py
      - name: Run deterministic mesh proof
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Verify public truth boundary
        run: |
          grep -q 'MODELED_MESH_SCENARIO_NOT_TPU_MEASUREMENT' README.md
          grep -q 'not affiliated with, endorsed by, or operated by Google or Google DeepMind' README.md
